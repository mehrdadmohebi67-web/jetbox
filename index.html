<style id="jbHeaderLogo3D_v29842">
/* v29.8.42 — Management header logo centered inside frame + 3D treatment */
#app>header .brand{flex:0 1 auto;width:min(245px,34vw);max-width:245px;min-width:0;height:64px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;perspective:700px;padding:0 10px;}
#app>header .brandLogo{width:calc(100% - 4px);height:58px;max-width:100%;object-fit:contain;object-position:center center;display:block;transform:perspective(700px) rotateY(-3deg) translateZ(3px);transform-origin:center center;filter:drop-shadow(0 3px 1px rgba(0,0,0,.32)) drop-shadow(0 7px 9px rgba(0,0,0,.22));transition:transform .22s ease,filter .22s ease;}
